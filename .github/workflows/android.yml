name: Android build and acceptance
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "release/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[acceptance-only]') && !contains(github.event.head_commit.message, '[signed-layout-release]') && !contains(github.event.head_commit.message, '[signed-release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK build
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: MedReminder-debug-installable
          path: app/build/outputs/apk/debug/*.apk
      - name: Export APK signing tool
        run: |
          mkdir -p signing-tools
          cp "$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort | tail -1)" signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            signing-tools/**
  acceptance:
    if: ${{ always() && (needs.build.result == 'success' || contains(github.event.head_commit.message, '[acceptance-only]')) && !contains(github.event.head_commit.message, '[layout-release]') && !contains(github.event.head_commit.message, '[signed-layout-release]') && !contains(github.event.head_commit.message, '[signed-release]') }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Database, UI and reminder acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            python3 ci/extract_screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            qa-screenshots/

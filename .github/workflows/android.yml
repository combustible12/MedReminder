name: Android build and acceptance
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[signed-layout-release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK build
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: MedReminder-debug-installable
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
  acceptance:
    if: ${{ !contains(github.event.head_commit.message, '[layout-release]') && !contains(github.event.head_commit.message, '[signed-layout-release]') }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Database, UI and reminder acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            python3 ci/extract_screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            qa-screenshots/
  publish:
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && contains(github.event.head_commit.message, '[signed-layout-release]'))) && (needs.acceptance.result == 'success' || needs.acceptance.result == 'skipped') }}
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Check signed deliverable
        id: ready
        run: echo "exists=$(test -f release/ready.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Verify signed deliverable and source binding
        if: steps.ready.outputs.exists == 'true'
        run: python3 ci/verify_release.py
      - name: Enable KVM for signed APK smoke test
        if: ${{ steps.ready.outputs.exists == 'true' && !contains(github.event.head_commit.message, '[layout-release]') && !contains(github.event.head_commit.message, '[signed-layout-release]') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch signed release
        if: ${{ steps.ready.outputs.exists == 'true' && !contains(github.event.head_commit.message, '[layout-release]') && !contains(github.event.head_commit.message, '[signed-layout-release]') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            curl -fL --retry 3 https://github.com/combustible12/MedReminder/releases/download/v1.0.0-build.13/MedReminder-1.0.0.apk -o /tmp/MedReminder-old.apk
            adb install /tmp/MedReminder-old.apk
            adb shell am start -W -n com.combustible12.medreminder/.MainActivity
            adb shell sleep 3
            adb install -r release/MedReminder-1.0.6.apk
            adb shell am start -W -n com.combustible12.medreminder/.MainActivity
            adb shell sleep 3
            adb shell pidof com.combustible12.medreminder
      - name: Publish installable APK
        if: steps.ready.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.6-build.${{ github.run_number }}"
          python3 - "$TAG" <<'PYTHON'
          import hashlib, json, sys
          from pathlib import Path
          apk = Path("release/MedReminder-1.0.6.apk")
          Path("release/update.json").write_text(json.dumps({"name": "MedReminder 1.0.6", "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(), "url": "https://github.com/combustible12/MedReminder/releases/download/" + sys.argv[1] + "/" + apk.name}))
          PYTHON
          gh release create "$TAG" release/MedReminder-1.0.6.apk release/update.json --title "MedReminder 1.0.6" --notes-file docs/RELEASE_NOTES.md --latest --target "${{ github.sha }}"
